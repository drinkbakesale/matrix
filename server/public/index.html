<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CR">
  <title>Matrix</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="style.css?v=41">
  <link rel="stylesheet" href="matrix-ui.css?v=2">

</head>
<body>
  <!-- Session List View -->
  <div id="list-view">
    <header>
      <h1>Matrix</h1>
      <div style="display:flex;gap:6px">
        <button id="add-btn" title="Add project">+</button>
        <button id="refresh-btn" title="Refresh">↻</button>
      </div>
    </header>
    <div id="push-debug" style="display:none;padding:6px 12px;font-size:11px;color:var(--amber);background:var(--surface);margin:8px 8px 0;border-radius:4px;border:1px solid var(--border)"></div>
    <div id="push-setup" style="display:none;padding:10px 12px;margin:8px 8px 0;background:var(--surface);border:1px solid var(--green);border-radius:4px;text-align:center">
      <span style="display:block;margin-bottom:8px;font-size:13px;color:var(--text)"></span>
      <button id="push-enable-btn" style="background:var(--green);color:#000;border:none;padding:10px 20px;border-radius:4px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;width:100%">Enable Notifications</button>
    </div>
    <button id="build-inbox-pin" class="build-inbox-pin" type="button">
      <span class="build-inbox-pin-icon" aria-hidden="true">▤</span>
      <span class="build-inbox-pin-label">Build Inbox</span>
      <span class="session-badge">Pinned</span>
    </button>
    <div id="sessions"></div>
  </div>

  <!-- Build Inbox View (read-only controller summary) -->
  <div id="build-inbox-view" style="display:none">
    <header id="build-inbox-header">
      <button id="build-inbox-back" type="button" title="Back">←</button>
      <span id="build-inbox-title">Build Inbox</span>
      <button id="build-inbox-refresh" type="button" title="Refresh">↻</button>
    </header>
    <div id="build-inbox-status" class="build-inbox-status" role="status"></div>
    <div id="build-inbox-content"></div>
  </div>

  <!-- Project Picker Modal -->
  <div id="picker-modal" style="display:none">
    <div id="picker-overlay"></div>
    <div id="picker-sheet">
      <div id="picker-header">
        <span>Start Project</span>
        <button id="picker-close">✕</button>
      </div>
      <div id="picker-list"></div>
    </div>
  </div>

  <!-- Terminal View -->
  <div id="term-view" style="display:none">
    <header id="term-header">
      <button id="back-btn">←</button>
      <span id="term-title"></span>
    </header>

    <!-- Pinned session brief: lives outside the scrolling transcript so it stays visible
         and a refresh can never replace a node the user is selecting. -->
    <section id="brief" class="brief" data-status="loading" data-collapsed="0">
      <div class="brief-head">
        <button id="brief-toggle" class="brief-toggle" type="button" aria-expanded="true" aria-controls="brief-body">Brief</button>
        <span id="brief-age" class="brief-age"></span>
      </div>
      <div id="brief-body" class="brief-body">
        <div class="brief-row">
          <span class="brief-label">Project goal</span>
          <span id="brief-goal" class="brief-value"></span>
          <button id="brief-edit-goal" class="brief-edit" type="button">Edit</button>
          <button id="brief-clear-goal" class="brief-clear" type="button" hidden>Clear edit</button>
        </div>
        <div class="brief-row">
          <span class="brief-label">Right now</span>
          <span id="brief-current" class="brief-value"></span>
          <button id="brief-edit-current" class="brief-edit" type="button">Edit</button>
          <button id="brief-clear-current" class="brief-clear" type="button" hidden>Clear edit</button>
        </div>
        <div id="brief-status" class="brief-status" role="status"></div>
      </div>
    </section>

    <div id="copy-bar" class="copy-bar">
      <button id="copy-open" class="copy-open" type="button">Select / copy</button>
      <span id="transcript-status" class="transcript-status" role="status"></span>
      <button id="transcript-resume" class="transcript-resume" type="button" hidden>Resume</button>
    </div>

    <pre id="terminal"></pre>

    <!-- Stable copy surface: plain text only, every control outside the text box so a copy
         never picks up a label or the brief. -->
    <div id="copy-sheet" class="copy-sheet" hidden>
      <div class="copy-sheet-head">
        <span class="copy-sheet-title">Copy transcript</span>
        <span id="copy-status" class="copy-status" role="status"></span>
      </div>
      <textarea id="copy-text" class="copy-text" readonly spellcheck="false"></textarea>
      <div class="copy-sheet-actions">
        <button id="copy-select-all" type="button">Select all</button>
        <button id="copy-selection" type="button">Copy selection</button>
        <button id="copy-all" type="button">Copy all</button>
        <button id="copy-resume" type="button">Resume live</button>
        <button id="copy-close" type="button">Close</button>
      </div>
    </div>

    <button id="talk-btn">TALK</button>
    <div id="quick-actions">
      <button class="qa-btn" data-input="y&#10;">y</button>
      <button class="qa-btn" data-input="n&#10;">n</button>
      <button class="qa-btn" data-input="1&#10;">1</button>
      <button class="qa-btn" data-input="2&#10;">2</button>
      <button class="qa-btn" data-input="3&#10;">3</button>
      <button class="qa-btn" data-key="Enter">enter</button>
      <button class="qa-btn" data-key="Escape">esc</button>
    </div>
    <div id="input-bar">
      <button id="attach-btn" title="Attach photos" aria-label="Attach photos">📎</button>
      <input type="text" id="text-input" placeholder="Type a message..." autocomplete="off" autocorrect="on" autocapitalize="sentences" enterkeyhint="send">
      <button id="send-btn" title="Send">↑</button>
    </div>
  </div>

  <script src="matrix-transcript.js?v=1"></script>
  <script src="matrix-copy.js?v=1"></script>
  <script src="matrix-brief.js?v=1"></script>
  <script src="app-notifications.js?v=1"></script>
  <script src="app-panels.js?v=1"></script>
  <script src="matrix-files.js?v=2"></script>
  <script src="app.js?v=45"></script>
</body>
</html>
